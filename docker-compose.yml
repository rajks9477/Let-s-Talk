version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: letstalk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: letstalk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Realtime Presence
  redis:
    image: redis:7-alpine
    container_name: letstalk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server & Realtime Gateway
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: letstalk_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/letstalk_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-secret-jwt-key-minimum-32-chars-long
      CLIENT_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: local
      UPLOAD_LOCAL_PATH: /app/uploads
    ports:
      - "5000:5000"
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Web Client (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: letstalk_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  media_uploads:
